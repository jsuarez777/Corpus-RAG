[tool.pytest.ini_options]
markers = [
    "slow: loads or downloads a model; deselect with -m 'not slow'",
    # Distinct from `slow`: these cost money rather than time, so a marker is
    # not enough — they also skip unless JUDGE_CALIBRATION=1 is set, and a
    # plain `pytest` must never spend anything.
    "paid: makes billed API calls; run with JUDGE_CALIBRATION=1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (core correctness), I = import sorting.
# E501 (line too long) is left to the formatter, not enforced as a lint error.
select = ["E", "F", "I"]
ignore = ["E501"]
